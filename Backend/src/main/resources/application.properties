
#port number
server.port=8085

#database config
spring.application.name=unsocial
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#jpa/hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


#jwr config
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

#logging
logging.level.com.unsocial=DEBUG
logging.level.org.springframework.security=INFO
-e


app.base-url=http://localhost:8085


#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


notification.email.enabled=true

#twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

notification.sms.enabled=true

#twilio whatsapp â uses the same Twilio account as SMS above.
#For development: join the Twilio WhatsApp Sandbox (Twilio console > Messaging
#> Try it out > Send a WhatsApp message) and set this to that sandbox number
#(commonly +14155238886). Each recipient must send the sandbox's join code
#once from their own WhatsApp before they can receive messages.
#For production: apply for a Meta-approved WhatsApp sender on a Twilio number.
#Flip notification.whatsapp.enabled=true once contacts have joined the sandbox.
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER}
notification.whatsapp.enabled=true
#AI Safety Assistant — RAG chatbot powered by a local Ollama instance.
#No API key needed — install Ollama (https://ollama.com), run `ollama serve`,
#then pull both models once:
#   ollama pull llama3.2
#   ollama pull nomic-embed-text
#ollama.base-url only needs changing if Ollama runs on a different host/port.
ollama.base-url=http://localhost:11434
ollama.chat-model=llama3.2
ollama.embedding-model=nomic-embed-text

#How many knowledge-base chunks to retrieve per question (RAG top-K)
chatbot.top-k=4
#How many recent chat turns to include as conversational context
chatbot.history-context-size=6

